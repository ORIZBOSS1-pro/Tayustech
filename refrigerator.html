<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FrostVault | Premium Refrigeration</title>
  
   <!-- PWA & Mobile Settings -->
 <meta name="description" content="TayusTech - Engineering">
 <link rel="manifest" href="manifest.json">
 <meta name="theme-color" content="#0d1117">
 <meta name="mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="default">
 <meta name="apple-mobile-web-app-title" content="Tayus Tech">
 <link rel="apple-touch-icon" href="tech.png">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header & Navigation */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .cart-btn:hover {
      background: var(--primary-dark);
    }

    /* Hero Banner */
    .hero {
      background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
      color: white;
      text-align: center;
      padding: 4rem 1rem;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }
    .hero a {
      text-decoration: none;
      color: white;
      background: #0284c7;
      border-radius: 20px;
      padding: 10px 30px;
      margin: 5px;
    }

    /* Layout */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 2rem;
    }

    /* Sidebar Filters */
    .filters {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      height: fit-content;
    }

    .filters h3 {
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .filter-group {
      margin-bottom: 1.2rem;
    }

    .filter-group label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .filter-group select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    /* Updated Image Container */
    .product-image {
      width: 100%;
      height: 220px;
      background: #f1f5f9;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.05);
    }

    .product-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .product-title {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .product-specs {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      list-style-position: inside;
    }

    .product-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .add-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .add-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Slide-out Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100%;
      background: var(--card-bg);
      box-shadow: -4px 0 12px rgba(0,0,0,0.1);
      transition: right 0.3s ease;
      z-index: 200;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .cart-footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .checkout-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }

    .checkout-btn:hover {
      background: #15803d;
    }
    
    /* Prevent iOS auto-zoom on input focus by keeping font-size at 16px minimum */
#whatsapp-checkout-form input,
#whatsapp-checkout-form textarea,
.filter-group select {
  font-size: 16px !important; /* Critical to prevent iOS mobile auto-zoom */
  touch-action: manipulation; /* Prevents double-tap zoom gestures */
}

/* Enhanced focus mode styling */
#whatsapp-checkout-form input:focus,
#whatsapp-checkout-form textarea:focus {
  outline: 2px solid #25D366;
  border-color: #25D366;
  background-color: #f0fdf4;
  box-shadow: 0 0 8px rgba(37, 211, 102, 0.3);
}


    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
      .cart-drawer {
        width: 100%;
        right: -100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">❄️  Fridge Vault</a>
      
      
      <button class="cart-btn" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
    </div>
    
    
  </header>

  <section class="hero">
    <h1>Advanced Home Refrigeration</h1>
    <p>Keep your food fresh longer with smart temperature controls and modern design.</p>
    
    <div>
  <a href="index.html"> Home ← </a>
  <a href="air-conditioner.html">AC Vault →</a>
</div>
  </section>

  <main class="container">
    <aside class="filters">
      <h3>Filter Products</h3>
      <div class="filter-group">
        <label for="type-filter">Door Style</label>
        <select id="type-filter" onchange="filterProducts()">
          <option value="all">All Styles</option>
          <option value="French Door">French Door</option>
          <option value="Side-by-Side">Side-by-Side</option>
          <option value="Top Freezer">Top Freezer</option>
          <option value="Mini Fridge">Mini Fridge</option>
        </select>
      </div>
    </aside>

    <section>
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>

  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="color: var(--text-muted);">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <h3>Total: <span id="cart-total">₦0</span></h3>
      <!-- Inside the cart-footer container -->
<button class="checkout-btn" onclick="openCheckoutModal()">Checkout via WhatsApp</button>

    </div>
  </aside>
  
  
  <!-- Checkout Modal -->
<div id="checkout-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:300; justify-content:center; align-items:center;">
  <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 400px; width: 90%;">
    <h2 style="margin-bottom: 1rem;">Complete Your Order</h2>
    <form id="whatsapp-checkout-form" onsubmit="processWhatsAppCheckout(event)">
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.3rem;">Full Name</label>
        <input type="text" id="customer-name" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.3rem;">Phone Number</label>
        <input type="tel" id="customer-phone" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.3rem;">Delivery Address / State</label>
        <textarea id="customer-address" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px; height: 80px;"></textarea>
      </div>
      <div style="display:flex; gap: 0.5rem;">
        <button type="submit" style="flex:1; background:#25D366; color:white; border:none; padding:0.7rem; border-radius:4px; font-weight:bold; cursor:pointer;">Order via WhatsApp</button>
        <button type="button" onclick="closeCheckoutModal()" style="background:#64748b; color:white; border:none; padding:0.7rem; border-radius:4px; cursor:pointer;">Cancel</button>
      </div>
    </form>
  </div>
</div>


  <script>
    // Updated Product Inventory Data with High-Quality Image URLs
    const products = [
      {
        id: 1,
        title: "FrostVault",
        type: "Top Freezer",
        price: 250000,
        specs: ["27.8 cu. ft.", "Dual Ice Maker", "Smart Temp Controls"],
        image: "image/fri.jpg"
      },
      {
        id: 2,
        title: "Apex Side-by-Side",
        type: "Side-by-Side",
        price: 500000,
        specs: ["25.5 cu. ft.", "In-Door Dispenser", "Fingerprint Resistant"],
        image: ""
      }, 
      {
        id: 3,
        title: "Classic Top Freezer",
        type: "Top Freezer",
        price: 300000,
        specs: ["18.0 cu. ft.", "Energy Star Certified", "Reversible Door"],
        image: ""
      },
      {
        id: 4,
        title: "Compact Counter Mini",
        type: "Mini Fridge",
        price: 375000,
        specs: ["3.2 cu. ft.", "Chiller Compartment", "Low Noise"],
        image: ""
      },
      {
        id: 5,
        title: "Chef Series Smart French Door",
        type: "French Door",
        price: 3750000,
        specs: ["30.0 cu. ft.", "Touchscreen Display", "Custom Zone Drawer"],
        image: ""
      }
    ];

    let cart = [];

    // Currency Formatter Utility
    function formatNGN(amount) {
      return '₦' + amount.toLocaleString('en-NG');
    }

    // Render Product Cards
    function renderProducts(filterType = 'all') {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      const filtered = filterType === 'all' 
        ? products 
        : products.filter(p => p.type === filterType);

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image">
            <img src="${p.image}" alt="${p.title}" loading="lazy">
          </div>
          <div class="product-info">
            <span class="product-category">${p.type}</span>
            <h3 class="product-title">${p.title}</h3>
            <ul class="product-specs">
              ${p.specs.map(spec => `<li>${spec}</li>`).join('')}
            </ul>
            <div class="product-bottom">
              <span class="price">${formatNGN(p.price)}</span>
              <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter Handler
    function filterProducts() {
      const selectedType = document.getElementById('type-filter').value;
      renderProducts(selectedType);
    }

    // Add Item to Cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartUI();
    }

    // Update Cart Sidebar & Counts
    function updateCartUI() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const cartTotal = document.getElementById('cart-total');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCount.textContent = totalItems;

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartTotal.textContent = formatNGN(totalPrice);

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="color: var(--text-muted);">Your cart is empty.</p>';
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.title}</strong>
            <p style="font-size: 0.85rem; color: var(--text-muted);">${formatNGN(item.price)} x ${item.quantity}</p>
          </div>
          <div>
            <button onclick="changeQuantity(${item.id}, -1)" style="padding: 2px 6px;">-</button>
            <button onclick="changeQuantity(${item.id}, 1)" style="padding: 2px 6px;">+</button>
          </div>
        </div>
      `).join('');
    }

    // Increment/Decrement Quantities
    function changeQuantity(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;

      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== productId);
      }

      updateCartUI();
    }

    // Cart Drawer Toggle
    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
    }

    // Initialize Page
    renderProducts();
    
    
    // Set your business WhatsApp phone number in international format (without + or spaces)
// Example for Nigeria: "2348012345678"
const STORE_WHATSAPP_NUMBER = "2347083085958"; 

// 1. Trigger Modal from the "Checkout" button
function openCheckoutModal() {
  if (cart.length === 0) {
    alert("Your cart is empty. Please add items before checking out.");
    return;
  }
  document.getElementById('checkout-modal').style.display = 'flex';
}

function closeCheckoutModal() {
  document.getElementById('checkout-modal').style.display = 'none';
}

// 2. Process Order and Send to WhatsApp
function processWhatsAppCheckout(event) {
  event.preventDefault();

  const name = document.getElementById('customer-name').value;
  const phone = document.getElementById('customer-phone').value;
  const address = document.getElementById('customer-address').value;

  // Calculate Order Totals
  const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

  // Format Items List
  let orderItemsText = "";
  cart.forEach((item, index) => {
    orderItemsText += `${index + 1}. *${item.title}*\n   Qty: ${item.quantity} x ${formatNGN(item.price)} = ${formatNGN(item.price * item.quantity)}\n`;
  });

  // Construct structured WhatsApp Message
  const message = 
`🛒 *NEW ORDER RECEIVED*

👤 *Customer Details:*
• *Name:* ${name}
• *Phone:* ${phone}
• *Address:* ${address}

📦 *Order Summary:*
${orderItemsText}
💰 *Total Amount:* ${formatNGN(totalAmount)}

Please confirm order details and delivery arrangement.`;

  // Encode text for URL format
  const encodedMessage = encodeURIComponent(message);
  
  // Create Direct WhatsApp Link
  const whatsappURL = `https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${encodedMessage}`;

  // Redirect to WhatsApp
  window.open(whatsappURL, '_blank');

  // Reset Cart and Close Modal
  cart = [];
  updateCartUI();
  closeCheckoutModal();
  toggleCart();
}

  </script>
</body>
</html>
